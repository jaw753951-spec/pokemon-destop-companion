# Build the desktop packages and attach them to a release.
#
# The assets are not in the repository, so every build fetches and rebuilds
# them first. That download is the slow part, so it is cached on the hash of
# the pipeline's own sources and the sprites the repository keeps (data/vendor,
# data/authored/sprites) — a change to either invalidates it, a change to the
# game code does not.
name: Build

on:
  push:
    tags: ['v*']
  # Releasing by hand as well as by tag. Pushing a tag is not always available
  # — some checkouts hold credentials that may push branches but not tags — and
  # the workflow's own token can create the tag, so the release is reachable
  # either way. Left empty, a dispatch only builds — a test build to download
  # from the run page, which can also be narrowed to the one OS being tried.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release under this tag (e.g. v0.1). Empty = build only.'
        required: false
        default: ''
      platforms:
        description: 'Which OS to build. A release needs all.'
        type: choice
        options: [all, win, mac, linux]
        default: all

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # A tag push has no inputs, so it falls through to all three.
        include: >-
          ${{ fromJSON(
            inputs.platforms == 'win' && '[{"os":"windows-latest","platform":"win"}]' ||
            inputs.platforms == 'mac' && '[{"os":"macos-latest","platform":"mac"}]' ||
            inputs.platforms == 'linux' && '[{"os":"ubuntu-latest","platform":"linux"}]' ||
            '[{"os":"ubuntu-latest","platform":"linux"},{"os":"windows-latest","platform":"win"},{"os":"macos-latest","platform":"mac"}]'
          ) }}
    runs-on: ${{ matrix.os }}

    steps:
      # The release job keeps the release to exactly what this run built, so a
      # release from one OS would strip the other two from it.
      - name: Refuse a release from part of the platforms
        if: inputs.release_tag != '' && inputs.platforms != 'all'
        run: |
          echo "::error::A release needs every platform; set platforms to 'all' or leave release_tag empty."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache built assets
        uses: actions/cache@v4
        with:
          path: |
            assets
            data/generated
            .cache
          key: assets-${{ hashFiles('dev/tools/**/*.mjs', 'package-lock.json', 'data/vendor/**', 'data/authored/sprites/**') }}

      - name: Build assets
        run: npm run assets

      - run: npm run typecheck
      - run: npm test

      - name: Package
        # There are no signing certificates for a fan project, so the macOS
        # build is left unsigned rather than failing on a missing identity.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --${{ matrix.platform }} --publish never

      # The packages only have to live long enough for the release job below
      # to pick them up, which happens within minutes. Kept for the default 90 days, the three platforms come to
      # ~750 MB a build and fill the account's Actions storage on their own.
      # A build-only dispatch has no release to download from, so its packages
      # stay a few days for someone to fetch them from the run page.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          retention-days: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag == '') && 3 || 1 }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release_tag != '' && inputs.platforms == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Published rather than drafted: the job only runs when all three
      # platform builds succeeded, and a draft nobody can download is not a
      # release. The notes carry the unsigned-build workarounds, without which
      # Windows and macOS simply refuse to open it.
      - uses: softprops/action-gh-release@v2
        with:
          # The dispatched tag is created at this commit if it does not exist.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          draft: false
          generate_release_notes: true
          body: |
            화면 위에 항상 떠 있는 작은 창 안에서 포켓몬이 혼자 여행하고, 싸우고,
            파밍하며 자라는 데스크탑 다마고치입니다. 받아서 실행하면 바로 시작합니다 —
            에셋이 패키지에 들어 있어서 추가로 내려받을 것이 없습니다.

            ## 받기

            | OS | 파일 |
            | --- | --- |
            | Windows | `*-win-x64.zip` — 압축을 풀고 `Pokemon Desktop Companion.exe` 실행 |
            | macOS | `*-mac-universal.dmg` — 애플 실리콘·인텔 공용 |
            | Linux | `*-linux-x86_64.AppImage` |

            ## 처음 실행할 때

            서명 인증서가 없는 개인 팬 프로젝트라 OS가 한 번 막습니다. 한 번만 넘기면 됩니다.

            - **Windows** — 설치 과정 없이 압축만 풀면 됩니다. "Windows의 PC 보호" 창이
              뜨면 **추가 정보 → 실행**
            - **macOS** — 앱을 **우클릭 → 열기 → 열기**. 그래도 막히면 터미널에서
              `xattr -dr com.apple.quarantine "/Applications/Pokemon Desktop Companion.app"`
            - **Linux** — `chmod +x *.AppImage` 후 실행

            ## 알아두면 좋은 것

            - 창은 화면의 약 1/16 크기로 항상 위에 뜹니다. 창 위쪽에 마우스를 올리면
              드래그 바가 나오고, 위치와 크기는 기억됩니다.
            - 세이브 3슬롯과 설정은 앱 바깥(`userData`)에 저장되므로 버전을 올려도 남습니다.
            - 5분마다 자동 저장되고, 설정에서 **저장 후 종료**로 끌 수 있습니다.

            ---

            비상업 팬 프로젝트입니다. Pokémon 및 관련 명칭·이미지·음악의 모든 권리는
            Nintendo / Creatures Inc. / GAME FREAK inc. 에 있습니다.

      # A release outlives the build that made it: drop a target and its last
      # artifact would sit on the release forever, since the upload above only
      # ever adds and replaces. This keeps the release to exactly what this
      # build produced.
      - name: Drop assets this build no longer produces
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ inputs.release_tag || github.ref_name }}'
          built="$(ls dist)"
          gh release view "$tag" --repo '${{ github.repository }}' \
            --json assets --jq '.assets[].name' |
          while read -r asset; do
            if ! grep -qxF "$asset" <<< "$built"; then
              echo "removing stale asset: $asset"
              gh release delete-asset "$tag" "$asset" --repo '${{ github.repository }}' --yes
            fi
          done
