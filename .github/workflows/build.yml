# Build the desktop packages and attach them to a release.
#
# The assets are not in the repository, so every build fetches and rebuilds
# them first. That download is the slow part, so it is cached on the hash of
# the pipeline's own sources — a change to the pipeline invalidates it, a
# change to the game code does not.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache built assets
        uses: actions/cache@v4
        with:
          path: |
            assets
            data/generated
            .cache
          key: assets-${{ hashFiles('tools/**/*.mjs', 'package-lock.json') }}

      - name: Build assets
        run: npm run assets

      - run: npm run typecheck
      - run: npm test

      - name: Package
        # There are no signing certificates for a fan project, so the macOS
        # build is left unsigned rather than failing on a missing identity.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
