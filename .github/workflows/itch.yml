# Publish the packaged builds to itch.io.
#
# Optional: it only runs when an ITCH_API_KEY secret and an ITCH_TARGET
# variable (user/game) are configured, so a fork without them is unaffected.
name: itch.io

on:
  workflow_run:
    workflows: ['Build']
    types: [completed]
  workflow_dispatch:

jobs:
  push:
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        run: echo "ready=${{ secrets.ITCH_API_KEY != '' && vars.ITCH_TARGET != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.config.outputs.ready != 'true'
        run: echo "ITCH_API_KEY or ITCH_TARGET is not set; nothing to publish." && exit 0

      - uses: actions/download-artifact@v4
        if: steps.config.outputs.ready == 'true'
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true

      - name: Install butler
        if: steps.config.outputs.ready == 'true'
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"

      - name: Push
        if: steps.config.outputs.ready == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          for channel in win linux mac; do
            files=$(ls dist/* 2>/dev/null | grep -iE "$channel" || true)
            [ -z "$files" ] && continue
            butler push $files "${{ vars.ITCH_TARGET }}:$channel"
          done
