# Typecheck and unit tests on main and on every pull request.
#
# The engine tests need the generated data, so this job builds it too — the
# same cache the packaging workflow uses keeps that cheap.
#
# Work branches are checked through their pull request rather than on every
# push: a push to a branch with an open PR would otherwise run this twice, and
# a branch with no PR yet can still be checked by hand (Run workflow).
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR makes the running check moot, so it
# is cancelled. On main a running check is always let finish.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache built assets
        uses: actions/cache@v4
        with:
          path: |
            assets
            data/generated
            .cache
          key: assets-${{ hashFiles('dev/tools/**/*.mjs', 'package-lock.json', 'data/vendor/**', 'data/authored/sprites/**') }}

      - name: Build assets
        run: npm run assets

      - run: npm run typecheck
      - run: npm test
