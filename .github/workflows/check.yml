# Typecheck and unit tests on every push.
#
# The engine tests need the generated data, so this job builds it too — the
# same cache the packaging workflow uses keeps that cheap.
name: Check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache built assets
        uses: actions/cache@v4
        with:
          path: |
            assets
            data/generated
            .cache
          key: assets-${{ hashFiles('dev/tools/**/*.mjs', 'package-lock.json') }}

      - name: Build assets
        run: npm run assets

      - run: npm run typecheck
      - run: npm test
