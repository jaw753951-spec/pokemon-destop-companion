<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src pdc: data:; media-src pdc:; connect-src pdc:; font-src 'self'"
    />
    <title>Pokémon Desktop Companion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- The companion is a frameless window, so it carries its own drag strip.
         It stays invisible until the pointer is near the top edge. -->
    <div id="dragbar">
      <span id="dragbar-title">POKÉMON DESKTOP COMPANION</span>
      <button id="minimize" type="button" title="Minimize">–</button>
    </div>

    <!-- Everything draws inside a fixed 480x270 stage that is scaled to the
         window, so a source pixel always maps to a whole number of screen ones. -->
    <div id="stage">
      <canvas id="scene" width="480" height="270"></canvas>
      <div id="overlay"></div>
      <div id="toast" hidden></div>
    </div>

    <script type="module" src="main.mjs"></script>
  </body>
</html>
