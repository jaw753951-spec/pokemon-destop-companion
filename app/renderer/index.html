<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src pdc: data:; media-src pdc:; connect-src pdc:; font-src 'self'"
    />
    <title>Pokémon Desktop Companion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- The companion is a frameless window, so it carries its own handles.
         The frame is everything behind the stage: the margin around the
         picture, which is window rather than game and is therefore somewhere
         to pick the companion up by. The strip is the top edge of the picture
         itself, for the sizes where there is no margin at all. Neither draws
         anything, and neither holds a control: the top of the companion only
         ever moves it, never minimizes or maximizes it. -->
    <div id="dragframe" data-drag></div>
    <div id="dragbar" data-drag></div>

    <!-- Everything draws inside a fixed 480x270 stage that is scaled to the
         window, so a source pixel always maps to a whole number of screen ones. -->
    <div id="stage">
      <canvas id="scene" width="480" height="270"></canvas>
      <div id="overlay"></div>
      <div id="toast" hidden></div>
    </div>

    <script type="module" src="main.mjs"></script>
  </body>
</html>
